# Periodično dohvaća podatke sa stranica saveza, zapisuje data/snapshot.json
# i, ako se nešto promijenilo, objavljuje novu verziju sitea.
name: Osvježi podatke

on:
  schedule:
    # 4 puta dnevno (UTC); po zagrebačkom vremenu oko 7, 13, 19 i 23 h.
    - cron: '0 5,11,17,21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm scrape
      - name: Zapiši promjene
        id: commit
        run: |
          # Vremenska oznaka generiranja mijenja se svaki put; zanimaju nas samo stvarne promjene.
          if git diff --quiet -I '"generatedAt":' -- data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nema promjena u podacima."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "data: osvježeni podaci $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/deploy.yml
